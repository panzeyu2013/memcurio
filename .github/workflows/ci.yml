name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # Pin the toolchain so CI results are reproducible; keep in sync with
        # the version used by maintainers locally.
        with:
          bun-version: 1.3.14
          cache: true

      # prepare (build + bundle) runs inside install; the lockfile must be
      # committed and in sync with package.json.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      # A deterministic locale so i18n-dependent tests are hermetic.
      - run: bun test
        env:
          LANG: C.UTF-8
      # Explicitly verify the build artifacts exist (prepare already built
      # them, so this is a no-op guard against a broken prepare).
      - run: test -f dist/cli/index.js -a -f dist/opencode-memcurio-plugin.js
      # Validate the published tarball contents (files list / prepare) so a
      # broken `files` field is caught in CI, not at publish time. Note: the
      # command is `bun pm pack` — plain `bun pack` is not a bun subcommand.
      - run: bun pm pack --dry-run
