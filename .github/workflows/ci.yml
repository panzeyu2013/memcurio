name: CI

# Chamber norm (ported from dsh-chamber-mcp): push main + tags v* + PRs run the
# SAME chain — a tag can never publish an untested commit — and the workflow is
# dispatchable for manual reruns. release.yml keeps its own release-local gate
# because tag-triggered workflows run in parallel with this one.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a 40-hex commit SHA (chamber supply-chain
      # norm); bump the pins by hand and re-run the verifier below.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify workflow action pins & release structure
        run: node scripts/verify-workflow-action-pins.mjs

      - uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        # Pin the toolchain so CI results are reproducible; keep in sync with
        # the version used by maintainers locally.
        with:
          bun-version: 1.3.14
          cache: true

      # prepare only verifies committed artifacts (dsh plugin installs from
      # local tarballs must not trigger a tsc build on user machines), so CI
      # builds explicitly. The lockfile must be committed and in sync with
      # package.json.
      - run: bun install --frozen-lockfile
      - run: bun run build

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      # Explicitly verify the build artifacts exist (prepare only warned).
      - run: test -f dist/plugin/index.js -a -f dist/engine.js -a -f dist/core/db.js -a -f lib/client.js
      - run: bun run pack:check
      - run: bun run eval:lexical
      # Committed dist/ must stay in sync with source. This check runs AFTER
      # pack:check (which rebuilds dist): a fresh build must not change the
      # committed artifacts — including the rebuild pack:check itself produced.
      - run: git diff --exit-code -- dist/ lib/

      # The published tarball is validated so a broken `files` field is caught
      # here, not at publish time. Note: the command is `bun pm pack` — plain
      # `bun pack` is not a bun subcommand. The plugin entry also runs under
      # node (node:sqlite), so the committed dist is smoke-imported under node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: bun pm pack --dry-run
      - run: npm pack --dry-run --ignore-scripts --cache /tmp/memcurio-npm-cache
      - run: node -e "import('./dist/plugin/index.js').then(m => { if (m.name !== 'memcurio') process.exit(1); console.log('plugin entry ok:', m.name); })"
