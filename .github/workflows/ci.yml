name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # Pin the toolchain so CI results are reproducible; keep in sync with
        # the version used by maintainers locally.
        with:
          bun-version: 1.3.14
          cache: true

      # prepare only verifies committed artifacts (git-spec plugin installs
      # must not trigger a tsc build on user machines), so CI builds
      # explicitly. The lockfile must be committed and in sync with
      # package.json.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run bundle:plugin

      - run: bun run typecheck
      - run: bun run lint
      # A deterministic locale so i18n-dependent tests are hermetic.
      - run: bun test
        env:
          LANG: C.UTF-8
      # Explicitly verify the build artifacts exist (prepare only warned).
      - run: test -f dist/cli/index.js -a -f dist/opencode-memcurio-plugin.js -a -f packages/dsh-plugin/lib/index.js
      - run: bun run pack:check
      - run: bun run eval:lexical
      # Committed dist/ must stay in sync with source. This check runs AFTER
      # pack:check (which rebuilds dist): a fresh build must not change the
      # committed artifacts — including the rebuild pack:check itself produced.
      - run: git diff --exit-code -- dist/ packages/dsh-plugin/lib/
      # Validate the published tarball contents (files list / prepare) so a
      # broken `files` field is caught in CI, not at publish time. Note: the
      # command is `bun pm pack` — plain `bun pack` is not a bun subcommand.
      - run: bun pm pack --dry-run
      - run: npm pack --dry-run --ignore-scripts --cache /tmp/memcurio-npm-cache
        working-directory: packages/dsh-plugin
      # The shipped CLI/MCP run on node (node:sqlite); verify the committed
      # dist actually runs under node, not just under bun. node_modules and
      # dist are already in place from the steps above.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dist/cli/index.js --version
      - run: node dist/cli/index.js init
        env:
          HOME: /tmp/memcurio-smoke-home
      - run: node dist/cli/index.js doctor
        env:
          HOME: /tmp/memcurio-smoke-home
