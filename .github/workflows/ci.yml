name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # Pin the toolchain so CI results are reproducible; keep in sync with
        # the version used by maintainers locally.
        with:
          bun-version: 1.3.14
          cache: true

      # prepare only verifies committed artifacts (dsh plugin installs from
      # local tarballs must not trigger a tsc build on user machines), so CI
      # builds explicitly. The lockfile must be committed and in sync with
      # package.json.
      - run: bun install --frozen-lockfile
      - run: bun run build

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      # Explicitly verify the build artifacts exist (prepare only warned).
      - run: test -f dist/plugin/index.js -a -f dist/engine.js -a -f dist/core/db.js
      - run: bun run pack:check
      - run: bun run eval:lexical
      # Committed dist/ must stay in sync with source. This check runs AFTER
      # pack:check (which rebuilds dist): a fresh build must not change the
      # committed artifacts — including the rebuild pack:check itself produced.
      - run: git diff --exit-code -- dist/
      # Validate the published tarball contents (files list / prepare) so a
      # broken `files` field is caught in CI, not at publish time. Note: the
      # command is `bun pm pack` — plain `bun pack` is not a bun subcommand.
      - run: bun pm pack --dry-run
      - run: npm pack --dry-run --ignore-scripts --cache /tmp/memcurio-npm-cache
      # The plugin entry runs under node (node:sqlite) once the host loads it;
      # verify the committed dist imports under node, not just under bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node -e "import('./dist/plugin/index.js').then(m => { if (m.name !== 'memcurio') process.exit(1); console.log('plugin entry ok:', m.name); })"
