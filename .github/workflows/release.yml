name: Release

# Tag-driven GitHub Release (tgz asset only) or manual dispatch (incl. a
# dry-run mode). Modeled on the dsh-chamber-mcp release conventions:
# - the FULL validation chain runs inside this workflow BEFORE any Release
#   mutation (tag-triggered workflows run in parallel with CI, so this gate
#   must be self-contained);
# - publication is serialized and never re-publishes over an existing
#   release: a *published* release for the tag fails closed; only stale
#   drafts are deleted (softprops would silently update an existing release).
#   A `gh release view` failure counts as "no release yet" ONLY when gh
#   reports its explicit not-found signal; network, rate-limit and 5xx errors
#   fail the gate closed instead of falling through to an overwrite;
# - release notes are composed from the released version's CHANGELOG section;
#   a non-empty [Unreleased] block is the fallback when that dated section is
#   missing or empty, and an empty pair fails the run;
# - the packed tgz ships with a .sha256 sidecar; the asset is exactly the
#   bytes the local gates produced;
# - every action is pinned to a 40-hex commit SHA and the pin/structure
#   verifier runs inside the gate (chamber supply-chain norm).
#
# ⚠ npm publishing is TEMPORARILY DISABLED — releases ship the packed
# `memcurio-dsh-plugin-<version>.tgz` as the GitHub Release asset; users
# install it directly, e.g.:
#   dsh plugin --profile <profile> add \
#     https://github.com/<owner>/memcurio/releases/download/v0.0.1/memcurio-dsh-plugin-0.0.1.tgz
# To re-enable npm publishing later: uncomment the "Publish to npm" step,
# add the repository secret NPM_TOKEN, and restore `id-token: write` in
# `permissions` when using `--provenance`.
#
# Release prep (recommended by the notes gate): move the CHANGELOG
# [Unreleased] content into `## [<version>] - <date>`, bump package.json,
# then tag v<version> (or dispatch this workflow with `version: <version>`
# and dry_run first). The gate falls back to a non-empty [Unreleased] when the
# dated section is not in the tree yet, and warns when [Unreleased] would be
# left behind.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release — MUST equal package.json version (X.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Dry run (gate + notes only; do not create/update the GitHub Release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# GitHub Releases are shared mutable state: serialize publication and never
# cancel a run that may already have mutated a release.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    name: Gate, pack, GitHub Release (tgz)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + attach assets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify workflow action pins & release structure
        run: node scripts/verify-workflow-action-pins.mjs

      - uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.3.14
          cache: true

      # The package verifies the plugin entry under node (node:sqlite).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full gate (build + typecheck + lint + tests + pack allowlist)
        run: |
          bun run build
          bun run typecheck
          bun run lint
          bun test
          bun run pack:check
          test -f lib/client.js
          git diff --exit-code -- dist/ lib/
          bun pm pack --dry-run
          node -e "import('./dist/plugin/index.js').then(m => { if (m.name !== 'memcurio') process.exit(1); console.log('plugin entry ok:', m.name); })"

      - name: Tag/version sanity
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_ver="${{ inputs.version }}"
          else
            tag_ver="${GITHUB_REF_NAME#v}"
          fi
          test "$pkg_ver" = "$tag_ver" || {
            echo "::error::package.json version $pkg_ver does not match requested v$tag_ver"
            exit 1
          }
          echo "Releasing memcurio@$pkg_ver"
          echo "PKG_VERSION=$pkg_ver" >> "$GITHUB_ENV"

      - name: Compose release notes from CHANGELOG
        run: node scripts/release-notes.mjs "$PKG_VERSION" --out .smoke/release-notes.md

      - name: Pack the release tarball + sha256 sidecar
        run: |
          mkdir -p .smoke/release
          bun pm pack --destination .smoke/release --ignore-scripts
          cd .smoke/release
          sha256sum memcurio-dsh-plugin-*.tgz > memcurio-dsh-plugin-${{ env.PKG_VERSION }}.tgz.sha256
          cat memcurio-dsh-plugin-${{ env.PKG_VERSION }}.tgz.sha256

      # A published release for this version is a hard stop; only stale
      # drafts from an aborted run are deleted first.
      - name: Refuse re-publishing an existing release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          view_err="$(mktemp)"
          if gh release view "v${{ env.PKG_VERSION }}" --json id,draft --jq '{id,draft}' >/tmp/rel.json 2>"$view_err"; then
            draft=$(jq -r '.draft' /tmp/rel.json)
            if [ "$draft" = "true" ]; then
              echo "stale draft v${{ env.PKG_VERSION }} exists — deleting before re-release"
              gh release delete "v${{ env.PKG_VERSION }}" --yes --cleanup-tag=false
            else
              echo "::error::release v${{ env.PKG_VERSION }} is already published; refusing to overwrite"
              exit 1
            fi
          else
            # A failed `gh release view` is NOT proof the release is absent:
            # network errors, rate limits and 5xx responses must fail closed,
            # or softprops/action-gh-release would silently overwrite the
            # published release. Only gh's own explicit "release not found"
            # message counts: a bare HTTP 404 can come from a proxy and is
            # treated as unproven.
            status=$?
            if [ "$status" -eq 1 ] && grep -qiE 'release not found' "$view_err"; then
              echo "no release v${{ env.PKG_VERSION }} yet — proceeding"
            else
              echo "::error::cannot prove release v${{ env.PKG_VERSION }} does not exist (gh exit $status); failing closed"
              cat "$view_err" >&2
              exit 1
            fi
          fi

      # ------------------------------------------------------------------
      # Temporarily disabled — npm publish. Re-enable when ready:
      #
      # - name: Publish to npm
      #   run: npm publish --provenance
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # ------------------------------------------------------------------

      - name: Create GitHub Release with tgz asset
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: memcurio v${{ env.PKG_VERSION }}
          body_path: .smoke/release-notes.md
          files: |
            .smoke/release/*.tgz
            .smoke/release/*.sha256
          fail_on_unmatched_files: true

      - name: Attach packed tarball artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: memcurio-dsh-plugin-tgz
          path: .smoke/release/*.tgz*
          if-no-files-found: error
